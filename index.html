<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID - Portal Berita Musik</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f2f2;
}

/* HEADER */
header{
background:#c00;
color:white;
padding:15px 20px;
font-size:26px;
font-weight:bold;
}

/* NAV */
nav{
background:#111;
padding:10px;
display:flex;
gap:15px;
justify-content:center;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
font-size:14px;
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

/* HEADLINE */
.headline{
background:white;
border-radius:8px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.headline img{
width:100%;
height:320px;
object-fit:cover;
}

.headline .content{
padding:15px;
}

.headline h2{
margin:0;
font-size:22px;
}

/* LIST BERITA */
.list{
display:flex;
flex-direction:column;
gap:15px;
}

.item{
display:flex;
background:white;
border-radius:8px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.item img{
width:120px;
height:90px;
object-fit:cover;
}

.item .text{
padding:10px;
}

.item h3{
margin:0;
font-size:14px;
}

/* RESPONSIVE */
@media(max-width:768px){
.container{
grid-template-columns:1fr;
}

.headline img{
height:220px;
}
}
</style>
</head>

<body>

<header>
MusicNewsID
</header>

<nav>
<a href="#">HOME</a>
<a href="#">MUSIC</a>
<a href="#">TRENDING</a>
</nav>

<div class="container">

<!-- HEADLINE -->
<div class="headline">
<img src="https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg">

<div class="content">
<h2>Roman Yosi - Perjalanan Musik dari Banten ke Dunia Digital</h2>
<p>Musisi independen yang terus berkembang di industri musik Indonesia.</p>
</div>
</div>

<!-- LIST BERITA -->
<div class="list">

<div class="item">
<img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d">
<div class="text">
<h3>Industri Musik Digital Semakin Berkembang di 2026</h3>
</div>
</div>

<div class="item">
<img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4">
<div class="text">
<h3>Tren Musik Indie Indonesia Naik Tajam</h3>
</div>
</div>

<div class="item">
<img src="https://images.unsplash.com/photo-1521337706264-a414f153a5e3">
<div class="text">
<h3>Platform Streaming Ubah Cara Musisi Berkarya</h3>
</div>
</div>

</div>

</div>

</body>
</html>
