<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#222;
padding:12px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.content{
padding:15px;
}

.button{
display:inline-block;
margin-top:10px;
background:red;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}
</style>
</head>

<body>

<header>
<h1>MusicNewsID</h1>
</header>

<nav>
<a href="#">HOME</a>
<a href="#">MUSIC</a>
<a href="#">TRENDING</a>
</nav>

<div class="container">
<div id="news"></div>
</div>

<script>

// 🔥 DATA SEMENTARA (AMAN + STABIL)
const data = [
{
title: "Roman Yosi - Perjalanan Musik",
desc: "Musisi independen Indonesia yang berkarya di dunia musik.",
img: "https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg"
},
{
title: "Roman Yosi - Karya Terbaru",
desc: "Rilis musik terbaru dengan gaya indie pop.",
img: "https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg"
}
];

let html = "";

data.forEach((item, index) => {

html += `
<div class="card">

<img src="${item.img}">

<div class="content">

<h2>${item.title}</h2>

<p>${item.desc}</p>

<a class="button" href="post.html?id=${index}">
Baca Selengkapnya
</a>

</div>

</div>
`;
});

document.getElementById("news").innerHTML = html;

</script>

</body>
</html>
