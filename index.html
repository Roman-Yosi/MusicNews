<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID - Berita Musik Terbaru</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">MusicNewsID</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="news.html">Music</a>
    <a href="post.html">Trending</a>
  </nav>
</header>

<section class="hero">
  <h1>MusicNewsID</h1>
  <p>Portal berita musik terbaru Indonesia</p>
</section>

<section class="container">
  <h2>Berita Terbaru</h2>
  <div id="posts">Memuat artikel...</div>
</section>

<script>
fetch("news-detail.html")
.then(res => res.text())
.then(data => {
  document.getElementById("posts").innerHTML = data;
})
.catch(() => {
  document.getElementById("posts").innerHTML = "Gagal memuat artikel.";
});
</script>

</body>
</html>
