<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111;
color:#fff;
padding:20px;
text-align:center;
}

nav{
background:#222;
padding:12px;
text-align:center;
}

nav a{
color:#fff;
text-decoration:none;
margin:0 10px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.1);
margin-bottom:20px;
}

.card img{
width:100%;
display:block;
}

.content{
padding:20px;
}

.button{
display:inline-block;
background:red;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}

.loading{
text-align:center;
padding:40px;
}
</style>
</head>

<body>

<header>
<h1>MusicNewsID</h1>
</header>

<nav>
<a href="#">HOME</a>
<a href="#">MUSIC</a>
<a href="#">TRENDING</a>
</nav>

<div class="container">
<div id="news"> 
<div class="loading">Memuat artikel...</div>
</div>
</div>

<script>
const container = document.getElementById("news");

fetch("https://romanyosi5.wordpress.com/wp-json/wp/v2/posts")
.then(res => res.json())
.then(data => {

let html = "";

data.forEach(post => {

let img = "https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg";

if(post.jetpack_featured_media_url){
img = post.jetpack_featured_media_url;
}

let text = post.excerpt.rendered
.replace(/<[^>]*>/g,'')
.substring(0,150);

html += `
<div class="card">

<img src="${img}" alt="${post.title.rendered}">

<div class="content">

<h2>${post.title.rendered}</h2>

<p>${text}...</p>

<a class="button"
href="${post.link}"
target="_blank"
rel="noopener noreferrer">
Baca Selengkapnya
</a>

</div>

</div>
`;

});

container.innerHTML = html;

})
.catch(err => {
container.innerHTML = "<div class='loading'>Gagal memuat artikel</div>";
console.log(err);
});
</script>

</body>
</html>
