```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#222;
padding:12px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 12px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
transition:.3s;
}

.card:hover{
transform:translateY(-3px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.content{
padding:15px;
}

.content h2{
font-size:20px;
margin-bottom:10px;
}

.content p{
color:#555;
line-height:1.5;
}

.button{
display:inline-block;
margin-top:10px;
background:red;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}

.loading{
text-align:center;
padding:40px;
font-size:18px;
}
</style>
</head>

<body>

<header>
<h1>MusicNewsID</h1>
</header>

<nav>
<a href="#">HOME</a>
<a href="#">MUSIC</a>
<a href="#">TRENDING</a>
</nav>

<div class="container">
<div id="news">
<div class="loading">Memuat artikel...</div>
</div>
</div>

<script>
const container = document.getElementById("news");

const rss = "https://romanyosi5.wordpress.com/feed/";

fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(rss))
.then(res => res.text())
.then(str => {

const parser = new DOMParser();
const xml = parser.parseFromString(str, "text/xml");

const items = xml.querySelectorAll("item");

let html = "";

items.forEach(item => {

const title = item.querySelector("title")?.textContent || "";
const link = item.querySelector("link")?.textContent || "";
const desc = item.querySelector("description")?.textContent || "";

const cleanDesc = desc.replace(/<[^>]*>/g,'').substring(0,150);

const img =
"https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg";

html += `
<div class="card">

<img src="${img}" alt="${title}">

<div class="content">

<h2>${title}</h2>

<p>${cleanDesc}...</p>

<a class="button"
href="${link}"
target="_blank"
rel="noopener noreferrer">
Baca Selengkapnya
</a>

</div>

</div>
`;
});

container.innerHTML = html || "<div class='loading'>Tidak ada artikel</div>";

})
.catch(err => {
console.log(err);
container.innerHTML = "<div class='loading'>Gagal memuat artikel</div>";
});
</script>

</body>
</html>
```
