<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNewsID</div>
</header>

<section class="container">
  <h2>Artikel Terbaru</h2>
  <div id="rss"></div>
</section>

<script>
async function loadRSS() {
  const rss = "https://romanyosi5.wordpress.com/feed/";

  const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(rss);

  try {
    const res = await fetch(proxy);
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.querySelectorAll("item");

    let html = "";

    items.forEach(item => {
      const title = item.querySelector("title").textContent;
      const link = item.querySelector("link").textContent;
      const desc = item.querySelector("description").textContent;

      html += `
        <div class="card">
          <h3><a href="${link}" target="_blank">${title}</a></h3>
          <p>${desc.replace(/<[^>]*>/g,'').substring(0,120)}...</p>
        </div>
      `;
    });

    document.getElementById("rss").innerHTML = html;

  } catch (err) {
    document.getElementById("rss").innerHTML =
      "<p>Gagal memuat RSS. Cek koneksi atau feed.</p>";
  }
}

loadRSS();
</script>

</body>
</html>
