<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID - Portal Musik</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">MusicNewsID</div>
  <nav>
    <a href="#">HOME</a>
    <a href="#">MUSIC</a>
    <a href="#">TRENDING</a>
  </nav>
</header>

<section class="hero">
  <h1>Berita Musik Terbaru</h1>
  <p>Update otomatis dari WordPress</p>
</section>

<section class="container">
  <h2>Artikel Terbaru</h2>

  <div id="rss-container" class="grid"></div>
</section>

<footer>
  <p>© 2026 MusicNewsID - Roman Yosi</p>
</footer>

<script>
async function loadRSS() {
  const rssUrl = "https://romanyosi5.wordpress.com/feed/";

  try {
    const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl));
    const data = await res.json();

    let html = "";

    data.items.forEach(item => {
      html += `
        <article class="card">
          <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
          <small>${new Date(item.pubDate).toLocaleDateString()}</small>
          <p>${item.description.replace(/<[^>]*>/g, '').substring(0, 120)}...</p>
        </article>
      `;
    });

    document.getElementById("rss-container").innerHTML = html;

  } catch (e) {
    document.getElementById("rss-container").innerHTML =
      "<p>Gagal memuat artikel RSS</p>";
  }
}

loadRSS();
</script>

</body>
</html>
