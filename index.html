<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID - Berita Musik Terbaru</title>
  <link rel="stylesheet" href="style.css">

  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <style>
    .loading {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }

    .error {
      text-align: center;
      color: #ff4d4d;
      padding: 20px;
    }

    .card h3 {
      margin: 0 0 10px 0;
    }

    .card p {
      color: #bbb;
      font-size: 14px;
    }

    .card a {
      display: inline-block;
      margin-top: 10px;
      color: #ff0055;
      text-decoration: none;
    }

    .card a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">MusicNewsID</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="news.html">Music</a>
    <a href="post.html">Trending</a>
  </nav>
</header>

<section class="hero">
  <h1>MusicNewsID</h1>
  <p>Portal berita musik otomatis dari WordPress</p>
</section>

<section class="container">
  <h2>Berita Terbaru</h2>
  <div id="posts" class="loading">Memuat berita...</div>
</section>

<script>
const RSS_PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";
const FEED = "https://romanyosi5.wordpress.com/feed/";

function cleanText(text) {
  return text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
}

fetch(RSS_PROXY + encodeURIComponent(FEED))
  .then(res => res.json())
  .then(data => {
    if (!data.items || data.items.length === 0) {
      document.getElementById("posts").innerHTML =
        "<div class='error'>Tidak ada berita ditemukan.</div>";
      return;
    }

    let html = "";

    data.items.forEach(item => {
      const title = item.title || "No Title";
      const link = item.link || "#";
      const desc = cleanText(item.description || "");

      html += `
        <article class="card">
          <h3>${title}</h3>
          <p>${desc.substring(0, 160)}...</p>
          <a href="${link}" target="_blank">Baca Selengkapnya</a>
        </article>
      `;
    });

    document.getElementById("posts").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("posts").innerHTML =
      "<div class='error'>Gagal memuat berita dari WordPress RSS.</div>";
    console.error(err);
  });
</script>

</body>
</html>
