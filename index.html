<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">MusicNewsID</div>
</header>

<section class="container">
  <h2>Berita Terbaru</h2>
  <div id="posts">Loading...</div>
</section>

<script>
fetch("data.json")
.then(res => res.json())
.then(data => {
  let html = "";

  data.forEach(item => {
    html += `
      <article class="card">
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
        <a href="post.html?id=${item.id}">Baca</a>
      </article>
    `;
  });

  document.getElementById("posts").innerHTML = html;
});
</script>

</body>
</html>
