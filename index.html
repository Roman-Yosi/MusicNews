```html
<script>

const rssUrl = "https://romanyosi5.wordpress.com/feed/";

const api =
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(rssUrl);

async function loadNews() {

const container =
document.getElementById("news-container");

try {

const response = await fetch(api);
const data = await response.json();

if (!data.items || data.items.length === 0) {

container.innerHTML = `
<div class="loading">
Belum ada artikel ditemukan.
</div>
`;

return;
}

let html = "";

data.items.forEach(post => {

let image = "";

if (post.thumbnail) {
image = post.thumbnail;
}
else if (
post.enclosure &&
post.enclosure.link
) {
image = post.enclosure.link;
}
else {
image =
"https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg";
}

const text = post.description
.replace(/<[^>]+>/g, "")
.replace(/\s+/g, " ")
.substring(0, 180);

const date = new Date(post.pubDate)
.toLocaleDateString("id-ID", {
day: "numeric",
month: "long",
year: "numeric"
});

html += `

<div class="news-card">

<img
src="${image}"
alt="${post.title}"
loading="lazy"
onerror="this.src='https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg'"
>

<div class="news-content">

<div style="
color:#888;
font-size:13px;
margin-bottom:8px;
">
${date}
</div>

<h2>${post.title}</h2>

<p>${text}...</p>

<a
class="read-more"
href="${post.link}"
target="_blank"
rel="noopener noreferrer"
>
Baca Selengkapnya
</a>

</div>

</div>

`;

});

container.innerHTML = html;

}

catch(error) {

container.innerHTML = `

<div class="loading">

❌ Gagal memuat artikel WordPress

<br><br>

Pastikan feed aktif:

<br>

https://romanyosi5.wordpress.com/feed/

</div>

`;

console.error(error);

}

}

loadNews();

</script>
```
