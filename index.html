<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  MusicNewsID
</header>

<div class="container" id="news">Loading berita...</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>

// 🔥 API WORDPRESS (lebih stabil tanpa _embed)
const apiURL =
"https://romanyosi5.wordpress.com/wp-json/wp/v2/posts?per_page=10";

let postsData = [];

// ================= FETCH DATA =================
fetch(apiURL)
.then(res => {
  if(!res.ok){
    throw new Error("API error");
  }
  return res.json();
})
.then(data => {

  postsData = data;

  let html = "";

  data.forEach((post, i) => {

    // ✔ gambar aman (fallback jika tidak ada featured image)
    let img = "https://via.placeholder.com/600x400";

    // WordPress kadang tidak kirim featured image langsung
    if(post.featured_media_url){
      img = post.featured_media_url;
    }

    // fallback extract image dari content (opsional)
    let contentHTML = post.content?.rendered || "";
    let tempDiv = document.createElement("div");
    tempDiv.innerHTML = contentHTML;
    let firstImg = tempDiv.querySelector("img");

    if(firstImg){
      img = firstImg.src;
    }

    // ✔ excerpt aman
    let excerpt = post.excerpt?.rendered
      ? post.excerpt.rendered.replace(/<[^>]*>/g, "")
      : "Tidak ada ringkasan";

    html += `
      <div class="card" onclick="openPost(${i})">
        <img class="thumb" src="${img}">
        <div class="content">
          <h3>${post.title?.rendered || "Tanpa Judul"}</h3>
          <div class="excerpt">${excerpt.slice(0,120)}...</div>
        </div>
      </div>
    `;
  });

  document.getElementById("news").innerHTML = html;

})
.catch(err => {

  console.log(err);

  document.getElementById("news").innerHTML = `
    <div style="padding:20px;color:red;text-align:center">
      ❌ Gagal load artikel dari WordPress<br>
      Coba refresh atau cek koneksi API
    </div>
  `;
});


// ================= OPEN FULL POST =================
function openPost(i){

  let post = postsData[i];

  let content = post.content?.rendered || "Konten tidak tersedia";

  // fallback gambar
  let img = "https://via.placeholder.com/600x400";

  let tempDiv = document.createElement("div");
  tempDiv.innerHTML = content;

  let firstImg = tempDiv.querySelector("img");

  if(firstImg){
    img = firstImg.src;
  }

  document.getElementById("modal-body").innerHTML = `
    <h2>${post.title?.rendered || ""}</h2>
    <p style="color:gray">
      ${new Date(post.date).toLocaleString()}
    </p>

    <img src="${img}" style="width:100%;border-radius:10px;margin:10px 0">

    <div style="line-height:1.8">
      ${content}
    </div>
  `;

  document.getElementById("modal").style.display = "block";
}


// ================= CLOSE MODAL =================
function closeModal(){
  document.getElementById("modal").style.display = "none";
}

</script>

</body>
</html>
