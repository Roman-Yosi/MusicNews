<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID - Portal Musik Indonesia</title>

<meta name="description" content="Berita musik Indonesia terbaru, artis, lagu, konser, dan trending musik.">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#111;
color:white;
padding:20px;
text-align:center;
}

.logo{
font-size:36px;
font-weight:bold;
}

nav{
background:#222;
padding:12px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.section-title{
font-size:28px;
margin-bottom:20px;
border-left:5px solid red;
padding-left:10px;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.news-card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.1);
transition:.3s;
}

.news-card:hover{
transform:translateY(-4px);
}

.news-card img{
width:100%;
height:220px;
object-fit:cover;
}

.news-content{
padding:15px;
}

.news-content h2{
font-size:20px;
margin-bottom:10px;
}

.news-content p{
color:#555;
line-height:1.6;
margin-bottom:15px;
}

.read-more{
display:inline-block;
background:red;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:5px;
}

.loading{
text-align:center;
font-size:20px;
padding:50px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

@media(max-width:768px){

.logo{
font-size:28px;
}

.news-card img{
height:200px;
}

}
</style>
</head>

<body>

<header>
<div class="logo">MusicNewsID</div>
</header>

<nav>
<a href="#">HOME</a>
<a href="#">MUSIC</a>
<a href="#">TRENDING</a>
</nav>

<div class="container">

<h1 class="section-title">
Berita Terbaru
</h1>

<div id="news-container" class="news-grid">

<div class="loading">
Memuat artikel...
</div>

</div>

</div>

<footer>
© 2026 MusicNewsID - Portal Musik Indonesia
</footer>

<script>

const rssUrl =
"https://romanyosi5.wordpress.com/feed/";

const api =
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(rssUrl);

fetch(api)
.then(response => response.json())
.then(data => {

let html = "";

data.items.forEach(post => {

let image =
post.thumbnail ||
"https://via.placeholder.com/800x450?text=MusicNewsID";

let text =
post.description
.replace(/<[^>]*>?/gm,'')
.substring(0,180);

html += `
<div class="news-card">

<img src="${image}" alt="${post.title}">

<div class="news-content">

<h2>${post.title}</h2>

<p>${text}...</p>

<a class="read-more"
href="${post.link}"
target="_blank">
Baca Selengkapnya
</a>

</div>

</div>
`;

});

document.getElementById("news-container").innerHTML =
html;

})
.catch(error => {

document.getElementById("news-container").innerHTML =

`<div class="loading">
Gagal memuat artikel dari WordPress.
</div>`;

console.log(error);

});

</script>

</body>
</html>
