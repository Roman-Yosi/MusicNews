<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  MusicNewsID
</header>

<section class="container">
  <h2>Berita Terbaru</h2>
  <div id="posts">Memuat berita WordPress...</div>
</section>

<script>
const FEED_URL = "https://romanyosi5.wordpress.com/feed/";

fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(FEED_URL))
  .then(res => res.json())
  .then(data => {

    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, "text/xml");
    const items = xml.querySelectorAll("item");

    let html = "";

    items.forEach(item => {
      const title = item.querySelector("title")?.textContent || "";
      const link = item.querySelector("link")?.textContent || "";
      const desc = item.querySelector("description")?.textContent || "";

      // HAPUS HTML BIAR BERSIH
      const cleanDesc = desc.replace(/<[^>]*>/g, "");

      html += `
        <article class="card">
          <h3>${title}</h3>
          <p>${cleanDesc.substring(0, 150)}...</p>
          <a href="${link}" target="_blank">Baca di WordPress</a>
        </article>
      `;
    });

    document.getElementById("posts").innerHTML = html;

  })
  .catch(() => {
    document.getElementById("posts").innerHTML =
      "Gagal memuat berita WordPress.";
  });
</script>

</body>
</html>
