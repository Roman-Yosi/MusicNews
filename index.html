<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicNewsID - Portal Musik</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  MusicNewsID
</header>

<div class="container" id="news">Loading berita...</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const api = "https://romanyosi5.wordpress.com/wp-json/wp/v2/posts?_embed";

let postsData = [];

fetch(api)
.then(res => res.json())
.then(data => {

  postsData = data;

  let html = "";

  data.forEach((post, i) => {

    let img = "";

    if(post._embedded && post._embedded["wp:featuredmedia"]){
      img = post._embedded["wp:featuredmedia"][0].source_url;
    }

    let text = post.excerpt.rendered.replace(/<[^>]*>/g, "");

    html += `
      <div class="card" onclick="openPost(${i})">
        <img class="thumb" src="${img || 'https://via.placeholder.com/600x400'}">
        <div class="content">
          <h3>${post.title.rendered}</h3>
          <div class="excerpt">${text.slice(0,120)}...</div>
        </div>
      </div>
    `;
  });

  document.getElementById("news").innerHTML = html;

});

function openPost(i){
  let post = postsData[i];

  let img = "";

  if(post._embedded && post._embedded["wp:featuredmedia"]){
    img = post._embedded["wp:featuredmedia"][0].source_url;
  }

  document.getElementById("modal-body").innerHTML = `
    <h2>${post.title.rendered}</h2>
    <p style="color:gray">${new Date(post.date).toLocaleString()}</p>
    <img src="${img || ''}">
    <div>${post.content.rendered}</div>
  `;

  document.getElementById("modal").style.display = "block";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
