<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  MusicNewsID
</header>

<section class="container">
  <h2>Berita Terbaru</h2>
  <div id="posts">Loading...</div>
</section>

<script>
const url = "https://romanyosi5.wordpress.com/feed/";

fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url))
  .then(res => res.json())
  .then(data => {

    if (!data.items || data.items.length === 0) {
      document.getElementById("posts").innerHTML =
        "Tidak ada berita dari WordPress.";
      return;
    }

    let html = "";

    data.items.forEach(item => {
      const title = item.title || "";
      const link = item.link || "";
      const desc = (item.description || "").replace(/<[^>]*>/g, "");

      html += `
        <article class="card">
          <h3>${title}</h3>
          <p>${desc.substring(0,150)}...</p>
          <a href="${link}" target="_blank">Baca di WordPress</a>
        </article>
      `;
    });

    document.getElementById("posts").innerHTML = html;
  })
  .catch(err => {
    console.log(err);
    document.getElementById("posts").innerHTML =
      "Gagal memuat berita (RSS error / diblok GitHub).";
  });
</script>

</body>
</html>
