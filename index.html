<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>MusicNewsID</header>

<div class="container" id="news">Loading berita...</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>

// ================= RSS WORDPRESS =================
const rssURL = "https://romanyosi5.wordpress.com/feed/";

let postsData = [];

// ================= FETCH RSS =================
fetch(rssURL)
.then(res => res.text())
.then(str => {

  // PARSE XML (NO API EXTERNAL)
  let parser = new DOMParser();
  let xml = parser.parseFromString(str, "text/xml");
  let items = xml.querySelectorAll("item");

  let html = [];

  items.forEach((item, i) => {

    let title = item.querySelector("title")?.textContent || "No Title";
    let link = item.querySelector("link")?.textContent || "#";
    let pubDate = item.querySelector("pubDate")?.textContent || "";

    let desc = item.querySelector("description")?.textContent || "";
    desc = desc.replace(/<[^>]*>/g,"");

    // ambil gambar dari description
    let imgMatch = desc.match(/<img.*?src=["'](.*?)["']/);
    let img = imgMatch ? imgMatch[1] : "https://via.placeholder.com/600x400";

    postsData.push({title, link, desc, img, pubDate});

    html += `
      <div class="card" onclick="openPost(${i})">
        <img class="thumb" src="${img}">
        <div class="content">
          <h3>${title}</h3>
          <div class="excerpt">${desc.slice(0,120)}...</div>
        </div>
      </div>
    `;
  });

  document.getElementById("news").innerHTML = html;

})
.catch(err => {
  console.log(err);
  document.getElementById("news").innerHTML =
  "❌ Gagal memuat RSS";
});


// ================= OPEN ARTICLE =================
function openPost(i){

  let p = postsData[i];

  document.getElementById("modal-body").innerHTML = `
    <h2>${p.title}</h2>
    <p style="color:gray">${p.pubDate}</p>
    <img src="${p.img}" style="width:100%;border-radius:10px;margin:10px 0">
    <div style="line-height:1.8">${p.desc}</div>
    <p><a href="${p.link}" target="_blank">Buka di WordPress →</a></p>
  `;

  document.getElementById("modal").style.display = "block";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

</script>

</body>
</html>
