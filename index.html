<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111;
color:#fff;
padding:20px;
text-align:center;
}

nav{
background:#222;
padding:12px;
text-align:center;
}

nav a{
color:#fff;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.content{
padding:15px;
}

.button{
display:inline-block;
margin-top:10px;
background:red;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}

.loading{
text-align:center;
padding:40px;
}

.error{
text-align:center;
color:red;
padding:20px;
}
</style>
</head>

<body>

<header>
<h1>MusicNewsID</h1>
</header>

<nav>
<a href="#">HOME</a>
<a href="#">MUSIC</a>
<a href="#">TRENDING</a>
</nav>

<div class="container">
<div id="news">
<div class="loading">Memuat artikel...</div>
</div>
</div>

<script>
window.onload = function () {

const container = document.getElementById("news");

// 🔥 DATA FALLBACK (PASTI TAMPIL)
const data = [
{
title: "Roman Yosi - Perjalanan Musik",
desc: "Musisi independen Indonesia yang aktif berkarya di dunia musik digital.",
img: "https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg",
link: "https://romanyosi5.wordpress.com/"
}
];

let html = "";

data.forEach(item => {
html += `
<div class="card">

<img src="${item.img}" alt="image">

<div class="content">

<h2>${item.title}</h2>

<p>${item.desc}</p>

<a class="button" href="${item.link}" target="_blank">
Baca Selengkapnya
</a>

</div>

</div>
`;
});

container.innerHTML = html;

console.log("MusicNewsID loaded OK");

};
</script>

</body>
</html>
