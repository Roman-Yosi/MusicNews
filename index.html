<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicNewsID</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111;
color:white;
padding:20px;
text-align:center;
font-size:28px;
}

nav{
background:#222;
padding:12px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.content{
padding:15px;
}

.button{
display:inline-block;
margin-top:10px;
background:red;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}
.loading{
text-align:center;
padding:40px;
}
</style>
</head>

<body>

<header>MusicNewsID</header>

<nav>
<a href="#">HOME</a>
<a href="#">MUSIC</a>
<a href="#">TRENDING</a>
</nav>

<div class="container">
<div id="news"><div class="loading">Memuat artikel...</div></div>
</div>

<script>
const container = document.getElementById("news");

// 🔥 AMBIL ARTIKEL ASLI WORDPRESS
fetch("https://romanyosi5.wordpress.com/wp-json/wp/v2/posts?_embed")
.then(res => res.json())
.then(posts => {

let html = "";

posts.forEach(post => {

let img =
post._embedded?.['wp:featuredmedia']?.[0]?.source_url ||
"https://via.placeholder.com/800x450";

let title = post.title.rendered;
let desc = post.excerpt.rendered.replace(/<[^>]*>/g,'').substring(0,160);

html += `
<div class="card">

<img src="${img}" alt="${title}">

<div class="content">

<h2>${title}</h2>

<p>${desc}...</p>

<a class="button" href="${post.link}" target="_blank">
Baca Selengkapnya
</a>

</div>

</div>
`;
});

container.innerHTML = html;

})
.catch(err => {
console.log(err);
container.innerHTML = "<div class='loading'>Gagal memuat artikel</div>";
});
</script>

</body>
</html>
