<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicNewsID</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  MusicNewsID
</header>

<section class="hero">
  <h1>Portal Berita Musik</h1>
  <p>Update terbaru Roman Yosi</p>
</section>

<section class="container">
  <h2>Berita Terbaru</h2>
  <div id="home-news"></div>
</section>

<script>
async function loadHome(){
  try {
    const res = await fetch("./data/news.json");
    const data = await res.json();

    document.getElementById("home-news").innerHTML =
      data.slice(0, 3).map(item => `
        <div class="card">
          <h3><a href="post.html?id=${item.id}">${item.title}</a></h3>
          <p>${item.desc}</p>
        </div>
      `).join("");
  } catch (e) {
    document.getElementById("home-news").innerHTML =
      "<div class='card'><h3>Data tidak ditemukan</h3></div>";
  }
}

loadHome();
</script>

</body>
</html>
