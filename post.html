<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

img{
width:100%;
border-radius:10px;
}

a{
display:inline-block;
margin-top:20px;
background:red;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1 id="title"></h1>
<img id="img">
<p id="desc"></p>

<a href="index.html">← Kembali</a>

</div>
</div>

<script>

const data = [
{
title: "Roman Yosi - Perjalanan Musik",
desc: "Musisi independen Indonesia yang berkarya di dunia musik.",
img: "https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg"
},
{
title: "Roman Yosi - Karya Terbaru",
desc: "Rilis musik terbaru dengan gaya indie pop.",
img: "https://raw.githubusercontent.com/Roman-Yosi/Poto-roman-yosi/main/Screenshot_20260525_145712_Google-3000x3000.jpg"
}
];

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

document.getElementById("title").innerText = data[id].title;
document.getElementById("img").src = data[id].img;
document.getElementById("desc").innerText = data[id].desc;

</script>

</body>
</html>
