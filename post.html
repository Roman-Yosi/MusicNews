<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Artikel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="content">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("data.json")
.then(res => res.json())
.then(data => {
  const item = data.find(d => d.id == id);

  if (!item) {
    document.getElementById("content").innerHTML = "Artikel tidak ditemukan";
    return;
  }

  document.getElementById("content").innerHTML = `
    <article class="card">
      <h1>${item.title}</h1>
      <p>${item.content}</p>
    </article>
  `;
});
</script>

</body>
</html>
