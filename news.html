<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>All News</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>MusicNewsID</header>

<section class="container">
  <h2>Semua Artikel</h2>

  <div id="news"></div>
</section>

<script>
fetch("./data/news.json")
  .then(res => res.json())
  .then(data => {
    document.getElementById("news").innerHTML =
      data.map(item => `
        <div class="card">
          <h3><a href="post.html?id=${item.id}">${item.title}</a></h3>
          <p>${item.desc}</p>
        </div>
      `).join("");
  });
</script>

</body>
</html>
